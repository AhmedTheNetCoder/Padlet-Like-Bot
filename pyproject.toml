[project]
name = "padlet-reaction-engine"
version = "1.0.0"
description = "Replacing 40s of Selenium with 1.5s of HTTP — a reverse-engineering case study on Padlet's reaction API."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://github.com/AhmedTheNetCoder/Padlet-Like-Bot"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
